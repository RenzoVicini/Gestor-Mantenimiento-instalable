<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestor Mantenimiento - Flota de Camiones</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- ============================================
     ENCABEZADO PRINCIPAL
     ============================================ -->
<div class="header-bar">
    <h1>Gestor de Mantenimiento de Flota</h1>
</div>
<!-- ============================================
     BOTÓN PARA MOSTRAR/OCULTAR FORMULARIO
     ============================================ -->
<button id="toggleFormularioBtn" class="btn-primary" style="margin-bottom:10px; margin-right: 93%" >Nueva Solicitud</button>

<!-- ============================================
     FORMULARIO DE CREACIÓN DE SOLICITUD
     ============================================ -->
<div id="formularioSolicitud" style="display:none; margin-top:10px; margin-bottom:20px;">
    <input type="text" id="patente"
           maxlength="7"
           oninput="validatePatenteInput(this)"
           placeholder="Patente del camión"
           style="color:black; width:125px; position:absolute; top:175px; left:20px;">

    <input type="text" id="descripcion"
           maxlength="120"
           oninput="document.getElementById('descCounter').textContent = this.value.length + '/120';"
           placeholder="Descripción"
           style="color:black; width:385px; position:absolute; top:220px; left:20px;">

    <span id="descCounter"
          style="position:absolute; top:253px; left:385px; font-size:12px; color:#ccc;">
          0/120
    </span>

    <button onclick="crearTarjeta()"
            class="btn-primary"
            style="width:125px; margin-bottom:10px; position:absolute; top:220px; left:440px;">
        Crear Solicitud
    </button>
</div>
<!-- ============================================
     TABLERO KANBAN (3 COLUMNAS)
     ============================================ -->
<div class="tablero">
    <div class="columna">
        <h2>Solicitudes de Revisión</h2>
        <div id="cards-solicitud" class="cards-container"></div>
    </div>

    <div class="columna">
        <h2>Mantenimiento Programado</h2>
        <div id="cards-programado" class="cards-container"></div>
    </div>

    <div class="columna">
        <h2>Tarjetas Cerradas</h2>
        <div id="cards-cerrada" class="cards-container"></div>
    </div>
</div>
<!-- ============================================
     SCRIPTS PRINCIPALES
     ============================================ -->
<script src="app.js"></script>
<!-- ============================================
     MODAL PARA SELECCIÓN DE FECHA
     ============================================ -->
<div id="dateModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center;">
    <div style="background:#262626; padding:20px; border-radius:12px; width:300px; box-shadow:0 4px 18px rgba(0,0,0,0.45); border:1px solid #333;">
        <h3 style="margin-top:0; color:#fff;">Seleccionar fecha</h3>
        <input type="date" id="fechaPicker" style="width:50%; padding:10px; border-radius:8px; border:1px solid #444; background:#1f1f1f; color:#e6e6e6;">
        <button id="confirmarFechaBtn" style="margin-top:15px; width:100%;">Confirmar</button>
        <button id="cancelarFechaBtn" class="btn-secondary" style="margin-top:10px; width:100%;">Cancelar</button>
    </div>
</div>
</body>
</html>
